<html>
  <head>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="call-screen">
      <video
        id="callerVideo"
        src="video/video-normal.mp4"
        loop
        muted
        playsinline
      ></video>

      <div id="overlay" class="detection-overlay hidden">
        <img class="call-icon alert" id="alert-icon" src="images/warning.svg" />
        <div class="alert" id="alert-text">DEEPFAKE DETECTED</div>
      </div>
      <div id="participants-list" class="participants-list hidden">
        <div id="participants-title" class="title">Participants</div>
        <div id="participants-subtitle" class="subtitle">
          Currently in this call (3)
        </div>
        <button class="contact-box">
          <div class="circle" id="contact-circle">PP</div>
          <div class="contact-text" onclick="showPerson(1)">Pedro Pascal</div>
        </button>
        <button class="contact-box">
          <div class="circle" id="contact-circle">BO</div>
          <div class="contact-text" onclick="showPerson(2)">Barack Obama</div>
        </button>
        <button class="contact-box">
          <div class="circle" id="contact-circle">DG</div>
          <div class="contact-text" onclick="showPerson(3)">You</div>
        </button>
      </div>
      <div class="navBar">
        <div class="timer" id="call-timer">00:00</div>
        <div class="controls-1">
          <button class="btn special" onclick="startScan()">
            <img
              class="call-icon active"
              id="fauxfoe-icon"
              src="images/FauxFoe_Logo_hieroglyph_white.png"
            />
            FauxFoe Scan
          </button>
          <button class="btn parts" id="chat" onclick="activate('chat')">
            <img
              class="call-icon active"
              id="chat-icon"
              src="images/chat.svg"
            />
            Chat
          </button>
          <button class="btn parts" id="parts" onclick="showHideParts()">
            <img
              class="call-icon active"
              id="parts-icon"
              src="images/parts.svg"
            />
            People
          </button>
        </div>
        <div class="controls-2 with-border">
          <button class="btn active" id="webcam" onclick="activate('webcam')">
            <img
              class="call-icon"
              id="webcam-icon"
              src="images/webcam-slash.svg"
            />
            Camera
          </button>
          <button
            class="btn active"
            id="microphone"
            onclick="activate('microphone')"
          >
            <img
              class="call-icon"
              id="microphone-icon"
              src="images/microphone-slash.svg"
            />
            Mic
          </button>
          <button class="btn" id="share" onclick="activate('share')">
            <img
              class="call-icon active"
              id="share-icon"
              src="images/share.svg"
            />
            Share
          </button>
        </div>
        <div class="endCall with-border">
          <button
            class="btn end"
            onclick="endCall()"
            onpointerover="activateEnd()"
          >
            <image class="call-icon" src="images/phone.svg"></image>
            Leave
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
